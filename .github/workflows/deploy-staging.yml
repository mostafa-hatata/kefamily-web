name: Deploy

# Every push to main deploys the theme to the Hostinger site over SSH, then
# checks the live pages. The site lives at kefamily.online once the domain is
# connected; until then (or if that folder doesn't exist) it falls back to the
# temporary staging domain. Needs the repository secret HOSTINGER_SSH_KEY
# (private half of the "github-actions-kefamily-web" key added in
# hPanel → Advanced → SSH Access).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  SSH_HOST: 46.202.156.101
  SSH_PORT: '65002'
  SSH_USER: u322190690

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        id: secret
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::HOSTINGER_SSH_KEY is not set yet — skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PHP syntax check
        if: steps.secret.outputs.ok == 'true'
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Set up SSH
        if: steps.secret.outputs.ok == 'true'
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Resolve site folder and URL
        if: steps.secret.outputs.ok == 'true'
        run: |
          if ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "test -f \$HOME/domains/kefamily.online/public_html/wp-config.php"; then
            DOMAIN=kefamily.online
          else
            DOMAIN=annual-cyan-antelope-31.hostingersite.com
          fi
          echo "SITE_DIR=domains/$DOMAIN/public_html" >> "$GITHUB_ENV"
          echo "THEME_PATH=domains/$DOMAIN/public_html/wp-content/themes/kefamily" >> "$GITHUB_ENV"
          echo "SITE_URL=https://$DOMAIN" >> "$GITHUB_ENV"
          echo "Deploying to $DOMAIN"

      - name: Back up current theme on the server
        if: steps.secret.outputs.ok == 'true'
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p \$HOME/kefamily-backups && if [ -d \"\$HOME/$THEME_PATH\" ]; then tar -czf \$HOME/kefamily-backups/theme-\$(date +%Y%m%d-%H%M%S).tgz -C \"\$HOME/$THEME_PATH\" . ; fi; ls -1t \$HOME/kefamily-backups/*.tgz 2>/dev/null | tail -n +11 | xargs -r rm -f"

      - name: Upload theme
        if: steps.secret.outputs.ok == 'true'
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'docs' \
            -e "ssh -p $SSH_PORT" ./ "$SSH_USER@$SSH_HOST:$THEME_PATH/"

      - name: Purge LiteSpeed cache (if available)
        if: steps.secret.outputs.ok == 'true'
        continue-on-error: true
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd \$HOME/$SITE_DIR && (command -v wp >/dev/null && wp litespeed-purge all 2>/dev/null || true)"

      - name: Smoke test live pages
        if: steps.secret.outputs.ok == 'true'
        run: |
          fail=0
          for p in "/" "/companies/" "/companies/kepixel/" "/companies/kemarq/" "/companies/kechat/" "/companies/keclinic/" "/solutions/" "/solutions/ecommerce/" "/solutions/clinics/" "/solutions/education/" "/solutions/nonprofits/" "/solutions/services/" "/solutions/apps/" "/how-it-works/" "/about/" "/book/" "/blog/" "/careers/" "/partners/" "/faq/" "/contact/" "/privacy-policy/" "/terms/" "/blog/server-side-tracking-explained/" "/ar/" "/ru/" "/de/" "/ar/book/" "/ru/blog/" "/de/companies/kepixel/" "/ar/blog/reduce-clinic-no-shows/" "/wp-sitemap.xml" "/wp-sitemap-kefamily-1.xml"; do
            case "$p" in *\?*) sep='&' ;; *) sep='?' ;; esac
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$SITE_URL$p${sep}nocache=$GITHUB_RUN_ID" || true)
            if [ "$code" != "200" ]; then echo "::error::$p returned $code"; fail=1; continue; fi
            if grep -qiE 'Fatal error|critical error' /tmp/page.html; then echo "::error::$p shows a PHP error"; fail=1; fi
            echo "OK $code $p"
          done
          exit $fail
